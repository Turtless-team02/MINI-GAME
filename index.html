<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRC 2026 REBUILT - Clean UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 기본 스타일 */
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0d0f12; color: #ffffff; font-family: 'Orbitron', sans-serif; touch-action: none; user-select: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hidden { display: none !important; }

        /* 메인 메뉴 레이어 (글래스모피즘 코어 스타일) */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(15, 23, 42, 0.8) 0%, rgba(4, 6, 10, 0.95) 100%); z-index: 10; backdrop-filter: blur(8px); }
        
        .menu-container { display: flex; gap: 24px; align-items: stretch; max-width: 950px; width: 92%; flex-wrap: wrap; justify-content: center; }
        
        /* 메뉴 박스 디자인 */
        .menu-box { background: rgba(22, 30, 49, 0.4); padding: 45px 40px; border-radius: 14px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.4); flex: 1; min-width: 320px; display: flex; flex-direction: column; justify-content: center; }
        .menu-box h1 { margin: 0 0 10px 0; font-size: 36px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-box p { color: #94a3b8; font-size: 13px; letter-spacing: 1.5px; margin: 0 0 35px 0; }

        /* 랭킹 박스 디자인 */
        .ranking-box { background: rgba(15, 22, 36, 0.6); padding: 30px; border-radius: 14px; border: 1px solid rgba(241, 196, 15, 0.2); flex: 1; min-width: 320px; max-height: 380px; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .ranking-box::-webkit-scrollbar { width: 6px; }
        .ranking-box::-webkit-scrollbar-track { background: transparent; }
        .ranking-box::-webkit-scrollbar-thumb { background: rgba(241, 196, 15, 0.3); border-radius: 3px; }
        
        .ranking-title { color: #f1c40f; font-size: 18px; font-weight: 700; margin: 0 0 20px 0; text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid rgba(241, 196, 15, 0.15); padding-bottom: 12px; }
        .rank-list { list-style: none; padding: 0; margin: 0; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 14px; color: #e2e8f0; }
        .rank-item.top3 { font-weight: 700; background: rgba(241, 196, 15, 0.03); border-radius: 6px; }
        .rank-item:nth-child(1) .rank-num { color: #f59e0b; }
        .rank-item:nth-child(2) .rank-num { color: #94a3b8; }
        .rank-item:nth-child(3) .rank-num { color: #b45309; }
        .loading-text-small { text-align: center; color: #64748b; font-size: 13px; padding: 30px 0; }

        /* 고급스러운 버튼 시스템 */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        button { padding: 14px 20px; font-size: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; font-weight: 700; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: #94a3b8; background: rgba(255,255,255,0.02); transition: all 0.2s ease; }
        
        .btn-easy:hover { background: rgba(46, 204, 113, 0.1); border-color: #2ecc71; color: #2ecc71; }
        .btn-normal:hover { background: rgba(241, 196, 15, 0.1); border-color: #f1c40f; color: #f1c40f; }
        .btn-hard:hover { background: rgba(231, 76, 60, 0.1); border-color: #e74c3c; color: #e74c3c; }
        button:active { transform: translateY(1px); }
        
        /* 대시보드 스타일 인게임 HUD */
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; z-index: 5; pointer-events: none; }
        
        .hud-panel { background: rgba(11, 17, 28, 0.85); padding: 16px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 6px; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .hud-title { font-size: 11px; color: #64748b; letter-spacing: 1px; margin-bottom: 2px; }
        .hud-value { display: flex; justify-content: space-between; align-items: baseline; }
        
        .score-blue { color: #38bdf8; font-size: 24px; font-weight: 900; }
        .score-red { color: #f87171; font-size: 24px; font-weight: 900; }
        .timer-val { color: #f1c40f; font-size: 18px; }
        .timer-danger { color: #ef4444; animation: pulse-text 0.5s infinite alternate; }
        @keyframes pulse-text { from { opacity: 0.6; } to { opacity: 1; } }

        /* 모던 탑입 탄약 슬롯 */
        .slot-container { display: flex; gap: 4px; margin-top: 4px; }
        .ball-slot { width: 18px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 1px; transition: background 0.15s; }
        .ball-slot.filled { background: #f1c40f; box-shadow: 0 0 4px rgba(241,196,15,0.4); }

        /* 컨트롤러 디자인 */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; z-index: 5; display: none; pointer-events: none; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; pointer-events: auto; opacity: 0.8; }
        
        #btn-shoot { position: absolute; bottom: 50px; right: 50px; width: 85px; height: 85px; border-radius: 50%; background: rgba(22, 30, 49, 0.8); border: 2px solid rgba(255,255,255,0.15); color: #fff; font-size: 14px; font-weight: 700; pointer-events: auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: all 0.1s; letter-spacing: 1px; }
        #btn-shoot:active { transform: scale(0.92); border-color: #f1c40f; color: #f1c40f; }
        
        #loading-text { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; color: #94a3b8; z-index: 5; letter-spacing: 4px; }

        @media (max-width: 768px) {
            #mobile-controls { display: block; }
            #hud { top: 12px; left: 12px; right: 12px; }
            .hud-panel { padding: 12px 16px; min-width: 140px; }
            .score-blue, .score-red { font-size: 20px; }
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="main-menu" class="ui-layer">
        <div class="menu-container">
            <div class="menu-box">
                <h1>FRC 2026</h1>
                <p>MATCH INITIALIZATION</p>
                <div class="btn-group">
                    <button class="btn-easy" onclick="startLoading('EASY')">EASY CONFIG</button>
                    <button class="btn-normal" onclick="startLoading('NORMAL')">NORMAL CONFIG</button>
                    <button class="btn-hard" onclick="startLoading('HARD')">HARD CONFIG</button>
                </div>
            </div>
            
            <div class="ranking-box">
                <h2 class="ranking-title">Global Leaderboard</h2>
                <ul class="rank-list" id="rank-list">
                    <div class="loading-text-small">Connecting to Server...</div>
                </ul>
            </div>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-panel">
            <div class="hud-title">SYSTEM STATUS</div>
            <div class="hud-value">
                <span style="color:#cbd5e1">TIME</span>
                <span id="time-display" class="timer-val">135</span>
            </div>
            <div class="hud-value" style="margin-top: 4px;">
                <span style="color:#38bdf8">BLUE (YOU)</span>
                <span id="score-display" class="score-blue">0</span>
            </div>
            <div class="slot-container" id="player-slots"></div>
        </div>
        
        <div class="hud-panel" style="text-align: right;">
            <div class="hud-title">OPPONENT AI</div>
            <div class="hud-value">
                <span style="color:#cbd5e1">HOST</span>
                <span style="color:#64748b; font-size:14px;">ACTIVE</span>
            </div>
            <div class="hud-value" style="margin-top: 4px;">
                <span style="color:#f87171">RED (AI)</span>
                <span id="ai-score-display" class="score-red">0</span>
            </div>
            <div class="slot-container" id="ai-slots" style="justify-content: flex-end;"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone"></div>
        <div id="btn-shoot">LAUNCH</div>
    </div>

    <div id="loading-text" class="hidden">LOADING ARENA...</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ==========================================
        // Firebase 연동 (Config 유지)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCYU2zBQ9teeh2DVusA1d-qB_ABIvFI_Bs",
            authDomain: "turtless-mini-game-1ef0a.firebaseapp.com",
            projectId: "turtless-mini-game-1ef0a",
            storageBucket: "turtless-mini-game-1ef0a.firebasestorage.app",
            messagingSenderId: "277255465210",
            appId: "1:277255465210:web:0ec0d5220bfb2ef77a4143",
            measurementId: "G-BZ81PNN533"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let leaderboard = [];

        function fetchLeaderboard() {
            db.collection("rankings").orderBy("score", "desc").limit(10).get()
            .then((querySnapshot) => {
                leaderboard = [];
                querySnapshot.forEach((doc) => leaderboard.push(doc.data()));
                renderLeaderboard();
            })
            .catch(() => {
                document.getElementById('rank-list').innerHTML = `<div class="loading-text-small" style="color:#ef4444;">Database Connection Error</div>`;
            });
        }

        function renderLeaderboard() {
            const listObj = document.getElementById('rank-list');
            listObj.innerHTML = '';
            if (leaderboard.length === 0) { listObj.innerHTML = '<div class="loading-text-small">NO RECORDS YET</div>'; return; }
            leaderboard.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = `rank-item ${index < 3 ? 'top3' : ''}`;
                li.innerHTML = `<span class="rank-num">#${index + 1}</span> <span class="rank-name">${entry.name}</span> <span class="rank-score">${entry.score} PTS</span>`;
                listObj.appendChild(li);
            });
        }
        fetchLeaderboard();

        // ==========================================
        // 게임 물리 및 코어 로직
        // ==========================================
        let gameState = 'MENU', timeLeft = 135, totalDroppedCycles = 0; 
        let score = 0, ballCount = 0, aiScore = 0, aiBallCount = 0, aiShootCooldown = 0;
        
        const aiStats = { 'EASY': { speed: 0.05, shootDelay: 80, errorMargin: 4.0 }, 'NORMAL': { speed: 0.09, shootDelay: 50, errorMargin: 1.5 }, 'HARD': { speed: 0.14, shootDelay: 30, errorMargin: 0.3 } };
        let activeAiConfig = aiStats['NORMAL'];
        let gameInterval, dropInterval;
        let fieldBalls = [], activeBullets = []; 
        const GRAVITY = 0.015; 
        const GLOBAL_YELLOW_MAT = new THREE.MeshLambertMaterial({ color: 0xf1c40f });

        function createSlots(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for(let i=0; i<7; i++) {
                const slot = document.createElement('div'); slot.className = 'ball-slot'; container.appendChild(slot);
            }
        }
        createSlots('player-slots'); createSlots('ai-slots');

        function updateSlots(containerId, count) {
            const slots = document.getElementById(containerId).children;
            for(let i=0; i<7; i++) {
                if(i < count) slots[i].classList.add('filled'); else slots[i].classList.remove('filled');
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 18); camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10); scene.add(dirLight);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(26, 14), new THREE.MeshLambertMaterial({ color: 0x222222 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 14), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        centerLine.rotation.x = -Math.PI / 2; centerLine.position.set(0, 0.01, 0); scene.add(centerLine);

        const goalGeo = new THREE.BoxGeometry(1.5, 3, 4);
        const blueGoal = new THREE.Mesh(goalGeo, new THREE.MeshLambertMaterial({ color: 0x3498db })); blueGoal.position.set(-12.5, 1.5, 0); scene.add(blueGoal);
        const redGoal = new THREE.Mesh(goalGeo, new THREE.MeshLambertMaterial({ color: 0xe74c3c })); redGoal.position.set(12.5, 1.5, 0); scene.add(redGoal);

        const robotGeo = new THREE.BoxGeometry(1.2, 1, 1.2);
        const playerRobot = new THREE.Mesh(robotGeo, new THREE.MeshLambertMaterial({ color: 0x2980b9 })); playerRobot.position.set(-6, 0.5, 0); scene.add(playerRobot);
        const aiRobot = new THREE.Mesh(robotGeo, new THREE.MeshLambertMaterial({ color: 0xc0392b })); aiRobot.position.set(6, 0.5, 0); scene.add(aiRobot);

        const keys = { w: false, a: false, s: false, d: false }; let joystickVector = { x: 0, y: 0 };
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; if(e.code === 'Space' && gameState === 'PLAYING') shootBall('PLAYER'); });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); if(gameState === 'PLAYING') shootBall('PLAYER'); });

        const joystickManager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '50%', top: '50%' }, color: '#f1c40f' });
        joystickManager.on('move', (evt, data) => { const force = Math.min(data.force, 1); joystickVector.x = Math.cos(data.angle.radian) * force; joystickVector.y = -Math.sin(data.angle.radian) * force; });
        joystickManager.on('end', () => { joystickVector = { x: 0, y: 0 }; });

        function startLoading(difficulty) {
            currentDifficulty = difficulty; activeAiConfig = aiStats[difficulty]; 
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('loading-text').classList.remove('hidden');
            gameState = 'LOADING'; setTimeout(startGame, 1000);
        }

        function startGame() {
            document.getElementById('loading-text').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameState = 'PLAYING';
            gameInterval = setInterval(() => {
                timeLeft--; document.getElementById('time-display').innerText = timeLeft;
                if(timeLeft <= 10) document.getElementById('time-display').classList.add('timer-danger');
                if (timeLeft <= 0) endGame();
            }, 1000);
            dropBalls(); dropInterval = setInterval(() => { if (totalDroppedCycles < 10) dropBalls(); }, 12000);
        }

        function dropBalls() {
            totalDroppedCycles++;
            for(let i=0; i<10; i++) {
                const ball = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), GLOBAL_YELLOW_MAT);
                ball.position.set((Math.random() - 0.5) * 10, 6 + Math.random() * 2, (Math.random() - 0.5) * 10); scene.add(ball); fieldBalls.push(ball);
            }
        }

        function shootBall(shooter) {
            let startPos, targetGoalPos, owner, spreadX = 0, spreadZ = 0; 
            if (shooter === 'PLAYER') {
                if (ballCount <= 0) return; ballCount--; updateSlots('player-slots', ballCount); 
                startPos = playerRobot.position; targetGoalPos = new THREE.Vector3(12.5, 2.5, 0); owner = 'PLAYER';
                spreadX = (Math.random() - 0.5) * 0.8; spreadZ = (Math.random() - 0.5) * 0.8;
            } else {
                if (aiBallCount <= 0) return; aiBallCount--; updateSlots('ai-slots', aiBallCount);
                startPos = aiRobot.position; targetGoalPos = new THREE.Vector3(-12.5, 2.5, 0); owner = 'AI';
                spreadX = (Math.random() - 0.5) * activeAiConfig.errorMargin; spreadZ = (Math.random() - 0.5) * activeAiConfig.errorMargin;
            }

            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), GLOBAL_YELLOW_MAT);
            bullet.position.copy(startPos); bullet.position.y = 1.0; scene.add(bullet);
            const distanceX = (targetGoalPos.x + spreadX) - startPos.x; const distanceZ = (targetGoalPos.z + spreadZ) - startPos.z;
            const travelFrames = Math.abs(distanceX) * 3.5; 
            const vx = distanceX / travelFrames; const vz = distanceZ / travelFrames;
            const vy = (targetGoalPos.y - startPos.y) / travelFrames + 0.5 * GRAVITY * travelFrames;
            activeBullets.push({ mesh: bullet, velocity: new THREE.Vector3(vx, vy, vz), targetPos: targetGoalPos, owner: owner });
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (gameState === 'PLAYING') {
                const speed = 0.15; let moveX = 0, moveZ = 0;
                if (keys.w) moveZ -= speed; if (keys.s) moveZ += speed;
                if (keys.a) moveX -= speed; if (keys.d) moveX += speed;
                if (joystickVector.x !== 0 || joystickVector.y !== 0) { moveX = joystickVector.x * speed; moveZ = joystickVector.y * speed; }

                if (playerRobot.position.z + moveZ > -6.5 && playerRobot.position.z + moveZ < 6.5) playerRobot.position.z += moveZ;
                if (playerRobot.position.x + moveX > -11.5 && playerRobot.position.x + moveX < 11.5) playerRobot.position.x += moveX;

                if (aiShootCooldown > 0) aiShootCooldown--;

                if (aiBallCount < 7 && fieldBalls.length > 0) {
                    let targetBall = fieldBalls[0]; let minDist = aiRobot.position.distanceTo(targetBall.position);
                    for (let i = 1; i < fieldBalls.length; i++) {
                        let dist = aiRobot.position.distanceTo(fieldBalls[i].position);
                        if (dist < minDist) { minDist = dist; targetBall = fieldBalls[i]; }
                    }
                    const moveDir = new THREE.Vector3().subVectors(targetBall.position, aiRobot.position); moveDir.y = 0; 
                    if (moveDir.length() > 0.1) { moveDir.normalize(); aiRobot.position.addScaledVector(moveDir, activeAiConfig.speed); }
                } else if (aiBallCount > 0 && aiShootCooldown <= 0) { shootBall('AI'); aiShootCooldown = activeAiConfig.shootDelay; }

                for (let i = fieldBalls.length - 1; i >= 0; i--) {
                    const ball = fieldBalls[i]; if (ball.position.y > 0.25) ball.position.y -= 0.1; 
                    if (playerRobot.position.distanceTo(ball.position) < 1.1 && ballCount < 7) { 
                        scene.remove(ball); fieldBalls.splice(i, 1); ballCount++; updateSlots('player-slots', ballCount); continue;
                    }
                    if (aiRobot.position.distanceTo(ball.position) < 1.1 && aiBallCount < 7) { 
                        scene.remove(ball); fieldBalls.splice(i, 1); aiBallCount++; updateSlots('ai-slots', aiBallCount);
                    }
                }

                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const bullet = activeBullets[i];
                    bullet.mesh.position.add(bullet.velocity); bullet.velocity.y -= GRAVITY;

                    if (bullet.mesh.position.distanceTo(bullet.targetPos) < 1.8) { 
                        if (bullet.owner === 'PLAYER') { score++; document.getElementById('score-display').innerText = score; } 
                        else { aiScore++; document.getElementById('ai-score-display').innerText = aiScore; }
                        scene.remove(bullet.mesh); activeBullets.splice(i, 1);
                    } else if (bullet.mesh.position.y < 0.1 || Math.abs(bullet.mesh.position.x) > 15 || Math.abs(bullet.mesh.position.z) > 10) {
                        scene.remove(bullet.mesh); activeBullets.splice(i, 1);
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function endGame() {
            clearInterval(gameInterval); clearInterval(dropInterval); gameState = 'MENU';
            const lowestTop10Score = leaderboard.length < 10 ? 0 : leaderboard[leaderboard.length - 1].score;
            if (score > 0 && (score > lowestTop10Score || leaderboard.length < 10)) {
                setTimeout(() => {
                    let nick = prompt(`[GLOBAL TOP 10 ENTRY]\nSCORE: ${score} PTS\nEnter your Nickname (max 10 chars):`, "Player");
                    if (nick) {
                        nick = nick.substring(0, 10);
                        db.collection("rankings").add({ name: nick, score: score, timestamp: firebase.firestore.FieldValue.serverTimestamp() })
                        .then(() => { alert(`SUCCESS!\nFINAL SCORE: YOU ${score} - ${aiScore} AI`); location.reload(); })
                        .catch(() => { alert("Server Error."); location.reload(); });
                    } else { location.reload(); }
                }, 400);
            } else { alert(`MATCH OVER!\nFINAL SCORE: YOU ${score} - ${aiScore} AI`); location.reload(); }
        }

        gameLoop();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
