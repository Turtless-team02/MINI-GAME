<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FRC 2026 REBUILT - Horizontal 1vs1</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #222; color: #fff; font-family: sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.8); z-index: 10; }
        .hidden { display: none !important; }
        
        .menu-box { background: #444; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #f1c40f; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #f1c40f; border: none; border-radius: 5px; font-weight: bold; }
        
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; z-index: 5; text-shadow: 2px 2px 2px #000; pointer-events: none; }
        .score-board { background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 8px; border: 1px solid #555; }
        #controls-guide { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #ccc; z-index: 5; pointer-events: none; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 10px; }
        #loading-text { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #f1c40f; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="main-menu" class="ui-layer">
        <div class="menu-box">
            <h1>FRC 2026: REBUILT</h1>
            <p>가로형 1:1 매치 및 포물선 발사 물리 구현</p>
            <button onclick="startLoading()">게임 시작</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="score-board">⏱️ TIME: <span id="time-display">135</span>s</div>
        <div class="score-board">🔵 PLAYER: <span id="ball-count">0/7</span> | 🔴 AI: <span id="ai-ball-count">0/7</span></div>
        <div class="score-board">🎯 SCORE - BLUE: <span id="score-display" style="color:#3498db">0</span> vs RED: <span id="ai-score-display" style="color:#e74c3c">0</span></div>
    </div>

    <div id="controls-guide" class="hidden">이동: WASD | 공 발사: Spacebar (우측 RED 골대 조준, 사거리 확보 필요)</div>
    <div id="loading-text" class="hidden">FRC 규격 경기장 빌드 중...</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        let gameState = 'MENU';
        let timeLeft = 135;
        let totalDroppedCycles = 0; 
        
        let score = 0, ballCount = 0; 
        let aiScore = 0, aiBallCount = 0, aiShootCooldown = 0;
        
        let gameInterval, dropInterval;
        let fieldBalls = [];  
        let activeBullets = []; 
        const GRAVITY = 0.015; // 포물선용 중력 상수

        // --- Three.js 세팅 ---
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        
        // 가로형 경기장을 비스듬히 중계 뷰로 바라보는 카메라
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 18);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10);
        scene.add(dirLight);

        // 1. 가로형 경기장 바닥 (가로 26, 세로 14 표준 비율 근사치)
        const floorGeo = new THREE.PlaneGeometry(26, 14);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);
        
        // 센터 라인 (가로 경기장 분할)
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 14), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.set(0, 0.01, 0);
        scene.add(centerLine);

        // 2. 임시 골대 구조물 (좌/우 배치)
        const goalGeo = new THREE.BoxGeometry(1.5, 3, 4);
        
        // BLUE 얼라이언스 골대 (왼쪽 끝 - 플레이어가 맞춰야 하는 타겟은 반대편 우측 RED 골대)
        const blueGoal = new THREE.Mesh(goalGeo, new THREE.MeshLambertMaterial({ color: 0x3498db }));
        blueGoal.position.set(-12.5, 1.5, 0);
        scene.add(blueGoal);

        // RED 얼라이언스 골대 (오른쪽 끝 - AI가 맞춰야 하는 타겟은 좌측 BLUE 골대)
        const redGoal = new THREE.Mesh(goalGeo, new THREE.MeshLambertMaterial({ color: 0xe74c3c }));
        redGoal.position.set(12.5, 1.5, 0);
        scene.add(redGoal);

        // 3. 로봇 세팅
        const robotGeo = new THREE.BoxGeometry(1.2, 1, 1.2);
        
        // 플레이어 로봇 (왼쪽 진영 스타트)
        const playerRobot = new THREE.Mesh(robotGeo, new THREE.MeshLambertMaterial({ color: 0x2980b9 }));
        playerRobot.position.set(-6, 0.5, 0); 
        scene.add(playerRobot);

        // AI 로봇 (오른쪽 진영 스타트)
        const aiRobot = new THREE.Mesh(robotGeo, new THREE.MeshLambertMaterial({ color: 0xc0392b }));
        aiRobot.position.set(6, 0.5, 0); 
        scene.add(aiRobot);

        // --- 키보드 제어 ---
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { 
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; 
            if(e.code === 'Space' && gameState === 'PLAYING') shootBall('PLAYER');
        });
        window.addEventListener('keyup', (e) => { 
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; 
        });

        function startLoading() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('loading-text').classList.remove('hidden');
            gameState = 'LOADING';
            setTimeout(startGame, 1500); 
        }

        function startGame() {
            document.getElementById('loading-text').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-guide').classList.remove('hidden');
            gameState = 'PLAYING';

            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            dropBalls(); 
            dropInterval = setInterval(() => {
                if (totalDroppedCycles < 10) dropBalls();
            }, 12000);
        }

        // 중앙 영역 위주로 공 투하
        function dropBalls() {
            totalDroppedCycles++;
            const ballGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const ballMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f }); 

            for(let i=0; i<10; i++) {
                const ball = new THREE.Mesh(ballGeo, ballMat);
                ball.position.set(
                    (Math.random() - 0.5) * 10, // 가로 중앙 기준
                    6 + Math.random() * 2, 
                    (Math.random() - 0.5) * 10
                );
                scene.add(ball);
                fieldBalls.push(ball);
            }
        }

        // --- 물리 적용 포물선 발사 로직 ---
        function shootBall(shooter) {
            let startPos, targetGoalPos, owner;

            if (shooter === 'PLAYER') {
                if (ballCount <= 0) return; 
                ballCount--;
                document.getElementById('ball-count').innerText = `${ballCount}/7`;
                startPos = playerRobot.position;
                targetGoalPos = new THREE.Vector3(12.5, 2.5, 0); // 상대방 골대 조준 (오른쪽)
                owner = 'PLAYER';
            } else {
                if (aiBallCount <= 0) return;
                aiBallCount--;
                document.getElementById('ai-ball-count').innerText = `${aiBallCount}/7`;
                startPos = aiRobot.position;
                targetGoalPos = new THREE.Vector3(-12.5, 2.5, 0); // 상대방 골대 조준 (왼쪽)
                owner = 'AI';
            }

            const bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 16, 16),
                new THREE.MeshLambertMaterial({ color: shooter === 'PLAYER' ? 0x3498db : 0xe74c3c })
            );
            bullet.position.copy(startPos);
            bullet.position.y = 1.0; 
            scene.add(bullet);

            // 거리 계산을 통한 고정 포물선 속도 벡타 계산
            const distanceX = targetGoalPos.x - startPos.x;
            const distanceZ = targetGoalPos.z - startPos.z;
            
            // 수평 이동 소요 프레임 설정 (거리에 비례하도록)
            const travelFrames = Math.abs(distanceX) * 3.5; 
            
            const vx = distanceX / travelFrames;
            const vz = distanceZ / travelFrames;
            // 중력을 거슬러 솟구쳤다 떨어지게 만드는 Y축 초기 속도 수식
            const vy = (targetGoalPos.y - startPos.y) / travelFrames + 0.5 * GRAVITY * travelFrames;

            activeBullets.push({
                mesh: bullet,
                velocity: new THREE.Vector3(vx, vy, vz),
                targetPos: targetGoalPos,
                owner: owner
            });
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (gameState === 'PLAYING') {
                // 1. 가로형 맵 제한 플레이어 이동
                const speed = 0.15;
                if (keys.w && playerRobot.position.z > -6.5) playerRobot.position.z -= speed;
                if (keys.s && playerRobot.position.z < 6.5)  playerRobot.position.z += speed;
                if (keys.a && playerRobot.position.x > -11.5) playerRobot.position.x -= speed;
                if (keys.d && playerRobot.position.x < 11.5) playerRobot.position.x += speed;

                // 2. AI 봇 인공지능 (가까운 공 탐색 및 조건부 사거리 슈팅)
                if (aiShootCooldown > 0) aiShootCooldown--;

                if (aiBallCount < 7 && fieldBalls.length > 0) {
                    let targetBall = fieldBalls[0];
                    let minDist = aiRobot.position.distanceTo(targetBall.position);
                    for (let i = 1; i < fieldBalls.length; i++) {
                        let dist = aiRobot.position.distanceTo(fieldBalls[i].position);
                        if (dist < minDist) { minDist = dist; targetBall = fieldBalls[i]; }
                    }
                    const moveDir = new THREE.Vector3().subVectors(targetBall.position, aiRobot.position);
                    moveDir.y = 0; 
                    if (moveDir.length() > 0.1) {
                        moveDir.normalize();
                        aiRobot.position.addScaledVector(moveDir, 0.09);
                    }
                } else if (aiBallCount > 0 && aiShootCooldown <= 0) {
                    // 사거리가 너무 가깝거나 멀지 않을 때 슛 폭발 확률 상승 시뮬레이션
                    shootBall('AI');
                    aiShootCooldown = 50; 
                }

                // 3. 공 수집
                for (let i = fieldBalls.length - 1; i >= 0; i--) {
                    const ball = fieldBalls[i];
                    if (ball.position.y > 0.25) ball.position.y -= 0.1; 

                    if (playerRobot.position.distanceTo(ball.position) < 1.1 && ballCount < 7) { 
                        scene.remove(ball); fieldBalls.splice(i, 1); ballCount++;
                        document.getElementById('ball-count').innerText = `${ballCount}/7`;
                        continue;
                    }
                    if (aiRobot.position.distanceTo(ball.position) < 1.1 && aiBallCount < 7) { 
                        scene.remove(ball); fieldBalls.splice(i, 1); aiBallCount++;
                        document.getElementById('ai-ball-count').innerText = `${aiBallCount}/7`;
                    }
                }

                // 4. 포물선 날아가기 및 실제 과녁 도달 판정
                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const bullet = activeBullets[i];
                    
                    // 위치에 가속도(물리 벡터) 더하기
                    bullet.mesh.position.add(bullet.velocity);
                    // Y축 속도에 중력 차감하여 아래로 꺾이게 만듦
                    bullet.velocity.y -= GRAVITY;

                    // 골대 구조물 상단 히트박스 판정
                    const distToGoal = bullet.mesh.position.distanceTo(bullet.targetPos);
                    
                    if (distToGoal < 1.8) { // 골대 정밀 유효 반경 충돌 시 득점
                        if (bullet.owner === 'PLAYER') {
                            score++; document.getElementById('score-display').innerText = score;
                        } else {
                            aiScore++; document.getElementById('ai-score-display').innerText = aiScore;
                        }
                        scene.remove(bullet.mesh);
                        activeBullets.splice(i, 1);
                    } 
                    // 바닥이나 맵 밖으로 떨어지면 노골 처리 후 소멸
                    else if (bullet.mesh.position.y < 0.1 || Math.abs(bullet.mesh.position.x) > 15) {
                        scene.remove(bullet.mesh);
                        activeBullets.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            clearInterval(gameInterval); clearInterval(dropInterval);
            gameState = 'MENU';
            alert(`경기 종료!\n최종 점수 - PLAYER: ${score}점 | AI: ${aiScore}점`);
            location.reload();
        }

        gameLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
