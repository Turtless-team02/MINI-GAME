<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FRC 2026 REBUILT - Proto v3</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #222; color: #fff; font-family: sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.8); z-index: 10; }
        .hidden { display: none !important; }
        
        .menu-box { background: #444; padding: 30px; border-radius: 10px; text-align: center; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #f1c40f; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #f39c12; }
        
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 22px; font-weight: bold; z-index: 5; text-shadow: 2px 2px 2px #000; pointer-events: none; }
        #controls-guide { position: absolute; bottom: 10px; left: 10px; font-size: 14px; color: #aaa; z-index: 5; pointer-events: none; }
        #loading-text { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #f1c40f; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="main-menu" class="ui-layer">
        <div class="menu-box">
            <h1>FRC 2026: REBUILT</h1>
            <p>1점 배점 및 임시 3D 골대 버전</p>
            <button onclick="startLoading()">게임 시작</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div>⏱️ TIME: <span id="time-display">135</span>s</div>
        <div>🟡 BALLS: <span id="ball-count">0 / 7</span></div>
        <div>🎯 SCORE: <span id="score-display">0</span></div>
    </div>

    <div id="controls-guide" class="hidden">이동: WASD | 공 발사: Spacebar</div>
    <div id="loading-text" class="hidden">3D 리소스 로딩 중...</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        let gameState = 'MENU';
        let timeLeft = 135;
        let score = 0;
        let ballCount = 0; 
        let totalDroppedCycles = 0; 
        
        let gameInterval, dropInterval;
        let fieldBalls = [];  
        let activeBullets = []; 

        // --- Three.js 세팅 ---
        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 14);
        camera.lookAt(0, 0, -2);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 조명
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 15, 5);
        scene.add(dirLight);

        // 1. 경기장 바닥
        const floorGeo = new THREE.PlaneGeometry(16, 20);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 2. 임시 골대 (나중에 3D 모델로 교체할 영역 - 녹색 상자 모양)
        // 실제 FRC 상단 구조물 비율을 감안해 가로 4, 높이 2.5, 두께 1로 가정
        const goalGeo = new THREE.BoxGeometry(4, 2.5, 1);
        const goalMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71, wireframe: false }); // 임시 에메랄드 녹색
        const goal = new THREE.Mesh(goalGeo, goalMat);
        goal.position.set(0, 1.25, -8); // 경기장 상단 끝부분에 배치
        scene.add(goal);

        // 3. 플레이어 로봇 (임시 3D 파란 상자)
        const robotGeo = new THREE.BoxGeometry(1.2, 1, 1.2);
        const robotMat = new THREE.MeshLambertMaterial({ color: 0x3498db });
        const playerRobot = new THREE.Mesh(robotGeo, robotMat);
        playerRobot.position.set(0, 0.5, 5); 
        scene.add(playerRobot);

        // --- 키보드 입력 ---
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { 
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; 
            if(e.code === 'Space' && gameState === 'PLAYING') shootBall();
        });
        window.addEventListener('keyup', (e) => { 
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; 
        });

        function startLoading() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('loading-text').classList.remove('hidden');
            gameState = 'LOADING';
            setTimeout(startGame, 1500); 
        }

        function startGame() {
            document.getElementById('loading-text').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls-guide').classList.remove('hidden');
            
            playerRobot.rotation.set(0,0,0);
            gameState = 'PLAYING';

            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);

            dropBalls(); 
            dropInterval = setInterval(() => {
                if (totalDroppedCycles < 10) dropBalls();
            }, 12000);
        }

        // 공 투하 (12초마다 하늘에서 10개씩)
        function dropBalls() {
            totalDroppedCycles++;
            const ballGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const ballMat = new THREE.MeshLambertMaterial({ color: 0xf1c40f }); 

            for(let i=0; i<10; i++) {
                const ball = new THREE.Mesh(ballGeo, ballMat);
                ball.position.set(
                    (Math.random() - 0.5) * 12,
                    6 + Math.random() * 2, 
                    (Math.random() - 0.5) * 6
                );
                scene.add(ball);
                fieldBalls.push(ball);
            }
        }

        // 공 발사
        function shootBall() {
            if (ballCount <= 0) return; 
            
            ballCount--;
            document.getElementById('ball-count').innerText = `${ballCount} / 7`;

            const bulletGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const bulletMat = new THREE.MeshLambertMaterial({ color: 0xf39c12 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(playerRobot.position);
            bullet.position.y = 1.2; // 로봇 상단 슈터 위치에서 발사되도록 상향 조정
            scene.add(bullet);

            // 임시 녹색 골대의 중심 상단을 향해 조준 발사
            const targetPos = new THREE.Vector3(0, 2.0, -8);
            const direction = new THREE.Vector3().subVectors(targetPos, bullet.position).normalize();
            
            activeBullets.push({ mesh: bullet, dir: direction, speed: 0.35 });
        }

        // 메인 게임 루프
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (gameState === 'LOADING') {
                playerRobot.rotation.y += 0.05;
            } 
            else if (gameState === 'PLAYING') {
                // 로봇 이동 경계 제한
                const speed = 0.12;
                if (keys.w && playerRobot.position.z > -9) playerRobot.position.z -= speed;
                if (keys.s && playerRobot.position.z < 9)  playerRobot.position.z += speed;
                if (keys.a && playerRobot.position.x > -7) playerRobot.position.x -= speed;
                if (keys.d && playerRobot.position.x < 7)  playerRobot.position.x += speed;

                // 맵에 떨어진 공 중력 & 충돌(수집) 체크
                for (let i = fieldBalls.length - 1; i >= 0; i--) {
                    const ball = fieldBalls[i];
                    if (ball.position.y > 0.25) {
                        ball.position.y -= 0.1; 
                    }

                    const dist = playerRobot.position.distanceTo(ball.position);
                    if (dist < 1.1) { 
                        if (ballCount < 7) { 
                            scene.remove(ball);
                            fieldBalls.splice(i, 1);
                            ballCount++;
                            document.getElementById('ball-count').innerText = `${ballCount} / 7`;
                        }
                    }
                }

                // 발사된 공 이동 및 골대 충돌 판정
                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const bullet = activeBullets[i];
                    bullet.mesh.position.addScaledVector(bullet.dir, bullet.speed);

                    // 변경된 임시 녹색 골대(Box)와의 거리 기반 충돌체크
                    const goalDist = bullet.mesh.position.distanceTo(new THREE.Vector3(0, 2.0, -8));
                    if (goalDist < 2.0) { // 골대 너비가 넓어졌으므로 판정 범위를 2.0으로 상향
                        scene.remove(bullet.mesh);
                        activeBullets.splice(i, 1);
                        
                        score += 1; // 기획안 반영: 공 하나에 1점 증가!
                        document.getElementById('score-display').innerText = score;
                    } 
                    else if (bullet.mesh.position.z < -12) {
                        scene.remove(bullet.mesh);
                        activeBullets.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(dropInterval);
            gameState = 'MENU';
            alert(`경기 종료! 최종 점수: ${score}점입니다.`);
            location.reload();
        }

        gameLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
