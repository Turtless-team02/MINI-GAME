<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRC 2026 REBUILT - Crimson UI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 기본 스타일 */
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050203; color: #ffffff; font-family: 'Orbitron', sans-serif; touch-action: none; user-select: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hidden { display: none !important; }

        /* 메인 메뉴 레이어 (크림슨 글래스모피즘 코어) */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(40, 10, 15, 0.85) 0%, rgba(10, 5, 7, 0.98) 100%); z-index: 10; backdrop-filter: blur(10px); }
        
        .menu-container { display: flex; gap: 24px; align-items: stretch; max-width: 950px; width: 92%; flex-wrap: wrap; justify-content: center; }
        
        /* 메뉴 박스 디자인 */
        .menu-box { background: rgba(25, 12, 15, 0.6); padding: 35px 30px; border-radius: 14px; text-align: center; border: 1px solid rgba(174, 25, 50, 0.25); box-shadow: 0 15px 40px rgba(174, 25, 50, 0.15), inset 0 0 20px rgba(174, 25, 50, 0.05); flex: 1.2; min-width: 320px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .menu-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #ae1932, transparent); }
        .menu-box h1 { margin: 0 0 5px 0; font-size: 32px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(135deg, #ffffff 0%, #ae1932 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 10px rgba(174,25,50,0.4)); }
        .menu-box p { color: #cbd5e1; font-size: 11px; letter-spacing: 2px; margin: 0 0 20px 0; }

        /* 로봇 선택 영역 */
        .robot-select-title { font-size: 12px; color: #ff4d6d; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,77,109,0.4); }
        .robot-options { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
        .robot-btn { padding: 12px 10px; font-size: 11px; flex: 1; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); border-radius: 6px; cursor: pointer; color: #94a3b8; transition: all 0.2s; }
        .robot-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .robot-btn.active[data-robot="TURRET"] { border-color: #2ecc71; color: #2ecc71; box-shadow: 0 0 10px rgba(46, 204, 113, 0.3); background: rgba(46, 204, 113, 0.05); }
        .robot-btn.active[data-robot="DUMPER"] { border-color: #e67e22; color: #e67e22; box-shadow: 0 0 10px rgba(230, 126, 34, 0.3); background: rgba(230, 126, 34, 0.05); }
        .robot-btn.active[data-robot="CLIMBER"] { border-color: #9b59b6; color: #9b59b6; box-shadow: 0 0 10px rgba(155, 89, 182, 0.3); background: rgba(155, 89, 182, 0.05); }

        /* 랭킹 박스 디자인 */
        .ranking-box { background: rgba(20, 10, 12, 0.7); padding: 30px; border-radius: 14px; border: 1px solid rgba(174, 25, 50, 0.3); flex: 1; min-width: 320px; max-height: 420px; overflow-y: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 15px rgba(174, 25, 50, 0.1); }
        .ranking-box::-webkit-scrollbar { width: 6px; }
        .ranking-box::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .ranking-box::-webkit-scrollbar-thumb { background: rgba(174, 25, 50, 0.5); border-radius: 3px; }
        
        .ranking-title { color: #ae1932; font-size: 18px; font-weight: 700; margin: 0 0 20px 0; text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid rgba(174, 25, 50, 0.2); padding-bottom: 12px; text-shadow: 0 0 8px rgba(174, 25, 50, 0.4); }
        .rank-list { list-style: none; padding: 0; margin: 0; }
        .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid rgba(174,25,50,0.08); font-size: 14px; color: #e2e8f0; transition: background 0.2s; }
        .rank-item:hover { background: rgba(174, 25, 50, 0.05); }
        .rank-item.top3 { font-weight: 700; background: linear-gradient(90deg, rgba(174, 25, 50, 0.12) 0%, transparent 100%); border-left: 3px solid #ae1932; border-radius: 0 6px 6px 0; margin-bottom: 4px; }
        .rank-item:nth-child(1) .rank-num { color: #ff4d6d; text-shadow: 0 0 8px rgba(255, 77, 109, 0.5); font-size: 16px; }
        .rank-item:nth-child(2) .rank-num { color: #ae1932; }
        .rank-item:nth-child(3) .rank-num { color: #8a1327; }
        .loading-text-small { text-align: center; color: #ae1932; font-size: 13px; padding: 30px 0; animation: pulse 1.5s infinite; }

        /* 고급스러운 버튼 시스템 */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        button.play-btn { padding: 14px 20px; font-size: 13px; cursor: pointer; border: 1px solid rgba(174, 25, 50, 0.3); border-radius: 8px; font-weight: 700; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: #e2e8f0; background: rgba(174, 25, 50, 0.05); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        
        button.play-btn::after { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; background: rgba(174, 25, 50, 0.2); border-radius: 50%; transform: translate(-50%, -50%); transition: width 0.4s, height 0.4s; z-index: -1; }
        button.play-btn:hover::after { width: 300px; height: 300px; }
        
        .btn-easy:hover { border-color: #ae1932; color: #fff; box-shadow: 0 0 15px rgba(174, 25, 50, 0.3); }
        .btn-normal:hover { border-color: #ae1932; color: #fff; box-shadow: 0 0 20px rgba(174, 25, 50, 0.5); text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .btn-hard:hover { border-color: #ff4d6d; color: #fff; box-shadow: 0 0 25px rgba(255, 77, 109, 0.6); }
        button:active { transform: translateY(2px); }
        
        /* 대시보드 스타일 인게임 HUD */
        #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; z-index: 5; pointer-events: none; }
        
        .hud-panel { background: rgba(15, 8, 10, 0.85); padding: 16px 22px; border-radius: 10px; border: 1px solid rgba(174, 25, 50, 0.2); border-top: 4px solid #ae1932; display: flex; flex-direction: column; gap: 6px; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(174, 25, 50, 0.1); backdrop-filter: blur(4px); }
        .hud-title { font-size: 11px; color: #cbd5e1; letter-spacing: 1.5px; margin-bottom: 2px; }
        .hud-value { display: flex; justify-content: space-between; align-items: baseline; }
        
        .score-blue { color: #38bdf8; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .score-red { color: #ae1932; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px rgba(174, 25, 50, 0.6); }
        .timer-val { color: #ae1932; font-size: 20px; text-shadow: 0 0 12px rgba(174, 25, 50, 0.5); }
        .timer-danger { color: #ff4d6d; animation: pulse 0.5s infinite alternate; text-shadow: 0 0 15px rgba(255, 77, 109, 0.8); }
        
        @keyframes pulse { from { opacity: 0.6; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* 탄약 슬롯 컨테이너 */
        .slot-container { display: flex; gap: 8px; margin-top: 8px; }

        /* 공 모양 슬롯 */
        .ball-slot { 
            width: 14px; height: 14px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 2px solid rgba(174, 25, 50, 0.3);
            border-radius: 50%; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
        }

        /* 공이 채워졌을 때 */
        .ball-slot.filled { 
            background: #f1c40f; border-color: #fff; 
            box-shadow: 0 0 12px #f1c40f, inset -3px -3px 6px rgba(184, 134, 11, 0.8); 
            transform: scale(1.15); 
        }

        /* 컨트롤러 디자인 */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; z-index: 5; display: none; pointer-events: none; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; pointer-events: auto; opacity: 0.8; }
        
        #btn-shoot { position: absolute; bottom: 50px; right: 50px; width: 85px; height: 85px; border-radius: 50%; background: rgba(25, 10, 12, 0.8); border: 2px solid rgba(174, 25, 50, 0.5); color: #fff; font-size: 14px; font-weight: 700; pointer-events: auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(174, 25, 50, 0.2); transition: all 0.15s; letter-spacing: 1px; backdrop-filter: blur(5px); }
        #btn-shoot:active { transform: scale(0.9); border-color: #ae1932; color: #ff4d6d; box-shadow: 0 0 25px rgba(174, 25, 50, 0.6), inset 0 0 20px rgba(174, 25, 50, 0.5); }
        
        #loading-text { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 900; color: #ae1932; z-index: 5; letter-spacing: 6px; text-shadow: 0 0 15px rgba(174, 25, 50, 0.6); animation: pulse 1s infinite alternate; }

        @media (max-width: 768px) {
            #mobile-controls { display: block; }
            #hud { top: 12px; left: 12px; right: 12px; }
            .hud-panel { padding: 12px 16px; min-width: 140px; }
            .score-blue, .score-red { font-size: 20px; }
            .menu-box h1 { font-size: 26px; }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="main-menu" class="ui-layer">
        <div class="menu-container">
            <div class="menu-box">
                <h1 style="font-size: 24px; white-space: nowrap;">FRC 2026/2nd SSRC</h1>
                <p>SSRC TEAM2 TURTLESS</p>
                
                <div class="robot-select-title">Select Your Robot</div>
                <div class="robot-options">
                    <button class="robot-btn active" data-robot="TURRET" onclick="selectRobot('TURRET')">TURRET SHOOTER<br>(GREEN)</button>
                    <button class="robot-btn" data-robot="DUMPER" onclick="selectRobot('DUMPER')">VECTOR DUMPER<br>(ORANGE)</button>
                    <button class="robot-btn" data-robot="CLIMBER" onclick="selectRobot('CLIMBER')">LATCH CLIMBER<br>(PURPLE)</button>
                </div>

                <div class="btn-group">
                    <button class="play-btn btn-easy" onclick="startLoading('EASY')">EASY MODE</button>
                    <button class="play-btn btn-normal" onclick="startLoading('NORMAL')">NORMAL MODE(RANKING)</button>
                    <button class="play-btn btn-hard" onclick="startLoading('HARD')">HARD MODE</button>
                </div>
            </div>
            
            <div class="ranking-box">
                <h2 class="ranking-title">WORLD RANKING_NORMAL ONLY</h2>
                <ul class="rank-list" id="rank-list">
                    <div class="loading-text-small">Connecting to Server...</div>
                </ul>
            </div>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-panel">
            <div class="hud-title">SYSTEM STATUS</div>
            <div class="hud-value">
                <span style="color:#cbd5e1">TIME</span>
                <span id="time-display" class="timer-val">135</span>
            </div>
            <div class="hud-value" style="margin-top: 4px;">
                <span style="color:#38bdf8">BLUE (YOU)</span>
                <span id="score-display" class="score-blue">0</span>
            </div>
            <div class="slot-container" id="player-slots"></div>
        </div>
        
        <div class="hud-panel" style="text-align: right;">
            <div class="hud-title">OPPONENT AI</div>
            <div class="hud-value">
                <span style="color:#cbd5e1">HOST</span>
                <span style="color:#ae1932; font-size:14px; text-shadow: 0 0 5px rgba(174,25,50,0.5);">ACTIVE</span>
            </div>
            <div class="hud-value" style="margin-top: 4px;">
                <span style="color:#ae1932">RED (AI)</span>
                <span id="ai-score-display" class="score-red">0</span>
            </div>
            <div class="slot-container" id="ai-slots" style="justify-content: flex-end;"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone"></div>
        <div id="btn-shoot">LAUNCH</div>
    </div>

    <div id="loading-text" class="hidden">LOADING ARENA...</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYU2zBQ9teeh2DVusA1d-qB_ABIvFI_Bs",
            authDomain: "turtless-mini-game-1ef0a.firebaseapp.com",
            projectId: "turtless-mini-game-1ef0a",
            storageBucket: "turtless-mini-game-1ef0a.firebasestorage.app",
            messagingSenderId: "277255465210",
            appId: "1:277255465210:web:0ec0d5220bfb2ef77a4143",
            measurementId: "G-BZ81PNN533"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let leaderboard = [];

        function fetchLeaderboard() {
            db.collection("rankings").orderBy("score", "desc").limit(10).get()
            .then((querySnapshot) => {
                leaderboard = [];
                querySnapshot.forEach((doc) => leaderboard.push(doc.data()));
                renderLeaderboard();
            })
            .catch(() => {
                document.getElementById('rank-list').innerHTML = `<div class="loading-text-small" style="color:#ff4d6d;">Database Connection Error</div>`;
            });
        }

        function renderLeaderboard() {
            const listObj = document.getElementById('rank-list');
            listObj.innerHTML = '';
            if (leaderboard.length === 0) { listObj.innerHTML = '<div class="loading-text-small">NO RECORDS YET</div>'; return; }
            leaderboard.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = `rank-item ${index < 3 ? 'top3' : ''}`;
                li.innerHTML = `<span class="rank-num">#${index + 1}</span> <span class="rank-name">${entry.name}</span> <span class="rank-score">${entry.score} PTS</span>`;
                listObj.appendChild(li);
            });
        }
        fetchLeaderboard();

        // 글로벌 설정 및 로봇 타입 선택 추가
        let selectedRobotType = 'TURRET'; // 기본값 초록 로봇
        function selectRobot(type) {
            selectedRobotType = type;
            document.querySelectorAll('.robot-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.robot === type) btn.classList.add('active');
            });
        }

        let gameState = 'MENU', timeLeft = 135, totalDroppedCycles = 0; 
        let score = 0, ballCount = 0, aiScore = 0, aiBallCount = 0, aiShootCooldown = 0;
        let currentDifficulty = 'NORMAL'; 
        
        const aiStats = { 'EASY': { speed: 0.05, shootDelay: 80, errorMargin: 4.0 }, 'NORMAL': { speed: 0.09, shootDelay: 50, errorMargin: 1.5 }, 'HARD': { speed: 0.14, shootDelay: 30, errorMargin: 0.3 } };
        let activeAiConfig = aiStats['NORMAL'];
        let gameInterval, dropInterval;
        let fieldBalls = [], activeBullets = []; 
        const GRAVITY = 0.015; 
        
        const BALL_GEO = new THREE.SphereGeometry(0.25, 16, 16);
        const GLOBAL_YELLOW_MAT = new THREE.MeshLambertMaterial({ color: 0xf1c40f });

        function createSlots(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for(let i=0; i<7; i++) {
                const slot = document.createElement('div'); slot.className = 'ball-slot'; container.appendChild(slot);
            }
        }
        createSlots('player-slots'); createSlots('ai-slots');

        function updateSlots(containerId, count) {
            const slots = document.getElementById(containerId).children;
            for(let i=0; i<7; i++) {
                if(i < count) slots[i].classList.add('filled'); else slots[i].classList.remove('filled');
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0507, 0.02);
        
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 16, 18); camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0507);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10); scene.add(dirLight);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(26, 14), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        
        const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 14), new THREE.MeshBasicMaterial({ color: 0xae1932, transparent: true, opacity: 0.5 }));
        centerLine.rotation.x = -Math.PI / 2; centerLine.position.set(0, 0.01, 0); scene.add(centerLine);

        // 오픈스캐드 규격 골대 3D 렌더링
        function createOfficialGoal(colorHex) {
            const goalGroup = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: colorHex });
            const metalMat = new THREE.MeshLambertMaterial({ color: 0x757575 });

            const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.2, 16), mat);
            baseMesh.position.y = 1.1;
            goalGroup.add(baseMesh);

            const funnelMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 0.8, 0.8, 16, 1, true), metalMat);
            funnelMesh.position.y = 2.6;
            goalGroup.add(funnelMesh);

            return goalGroup;
        }

        const blueGoal = createOfficialGoal(0x2980b9); blueGoal.position.set(-12.5, 0, 0); scene.add(blueGoal);
        const redGoal = createOfficialGoal(0xae1932); redGoal.position.set(12.5, 0, 0); scene.add(redGoal);

        // ==========================================
        // [오픈스캐드 규격 3D 로봇 에셋 빌더]
        // ==========================================
        const COLOR_BOT_GREEN = 0x1abc9c; 
        const COLOR_BOT_ORANGE = 0xe67e22; 
        const COLOR_BOT_PURPLE = 0x9b59b6; 
        const COLOR_METAL = 0xbdc3c7;

        // 공통 로봇 프레임워크 섀시 (범퍼 + 바퀴 + 프레임)
        function createRobotChassis(bumperColorHex) {
            const chassis = new THREE.Group();
            const bumperMat = new THREE.MeshLambertMaterial({ color: bumperColorHex });
            const metalMat = new THREE.MeshLambertMaterial({ color: COLOR_METAL });
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            // 외부 범퍼 프레임 (가로세로 74mm 대칭 구조 축소 비율)
            const bumper = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.24, 1.4), bumperMat);
            bumper.position.y = 0.12;
            chassis.add(bumper);

            // 알루미늄 내부 메탈 프레임
            const innerFrame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.12, 1.2), metalMat);
            innerFrame.position.y = 0.14;
            chassis.add(innerFrame);

            // 4개 바퀴 (Cylinder)
            const wheelGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.2, 12);
            wheelGeo.rotateZ(Math.PI / 2);

            const offsets = [[0.54, 0.54], [-0.54, 0.54], [0.54, -0.54], [-0.54, -0.54]];
            offsets.forEach(offset => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(offset[0], 0.1, offset[1]);
                chassis.add(wheel);
            });

            return chassis;
        }

        // 로봇 1: 터렛 슈터 (초록)
        function buildTurretShooter() {
            const bot = createRobotChassis(COLOR_BOT_GREEN);
            const metalMat = new THREE.MeshLambertMaterial({ color: COLOR_METAL });
            const greenMat = new THREE.MeshLambertMaterial({ color: COLOR_BOT_GREEN });

            // 터렛 베이스 회전판
            const turretPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.16, 16), new THREE.MeshLambertMaterial({ color: 0x333333 }));
            turretPlate.position.y = 0.3;
            bot.add(turretPlate);

            // 포탑 구조체 (각도 회전)
            const turretTop = new THREE.Group();
            turretTop.position.y = 0.5;

            const shooterBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.5), greenMat);
            turretTop.add(shooterBody);

            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.36, 12), metalMat);
            barrel.rotateZ(-Math.PI / 3); // 30도 위로 겨냥
            barrel.position.set(0.3, 0.1, 0);
            turretTop.add(barrel);

            bot.add(turretTop);
            return bot;
        }

        // 로봇 2: 벡터 덤퍼 (주황)
        function buildVectorDumper() {
            const bot = createRobotChassis(COLOR_BOT_ORANGE);
            const metalMat = new THREE.MeshLambertMaterial({ color: COLOR_METAL });
            const orangeMat = new THREE.MeshLambertMaterial({ color: COLOR_BOT_ORANGE });

            // 지지 가이드 빔
            const beamLeft = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.52, 0.12), metalMat);
            beamLeft.position.set(-0.3, 0.4, 0.32);
            bot.add(beamLeft);

            const beamRight = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.52, 0.12), metalMat);
            beamRight.position.set(-0.3, 0.4, -0.32);
            bot.add(beamRight);

            // 적재함 슬라이더 구조 (뒤쪽 경사)
            const dumperBin = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.48, 0.84), orangeMat);
            dumperBin.position.set(0.2, 0.72, 0);
            dumperBin.rotation.z = -0.26; // 뒤쪽으로 살짝 경사
            bot.add(dumperBin);

            return bot;
        }

        // 로봇 3: 래치 클라이머 (보라)
        function buildLatchClimber() {
            const bot = createRobotChassis(COLOR_BOT_PURPLE);
            const metalMat = new THREE.MeshLambertMaterial({ color: COLOR_METAL });
            const purpleMat = new THREE.MeshLambertMaterial({ color: COLOR_BOT_PURPLE });

            // 중앙 보라색 바디 박스
            const centerCore = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.48, 0.7), purpleMat);
            centerCore.position.y = 0.38;
            bot.add(centerCore);

            // 클라이머 지탱 빔 타워
            const liftTower = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.2, 0.24), metalMat);
            liftTower.position.set(-0.4, 0.8, 0);
            bot.add(liftTower);

            // 상단 래치 고리 후크 구조
            const hook = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 0.32), metalMat);
            hook.position.set(-0.2, 1.4, 0);
            hook.rotation.z = 0.26;
            bot.add(hook);

            return bot;
        }

        // 선택 및 무작위에 따른 실시간 인스턴스 팩토리
        function generateRobotMesh(type) {
            if(type === 'TURRET') return buildTurretShooter();
            if(type === 'DUMPER') return buildVectorDumper();
            return buildLatchClimber(); // CLIMBER
        }

        let playerRobot, aiRobot;

        const keys = { w: false, a: false, s: false, d: false }; let joystickVector = { x: 0, y: 0 };
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; if(e.code === 'Space' && gameState === 'PLAYING') shootBall('PLAYER'); });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let joystickManager = null;

        function initMobileControls() {
            const mobileControls = document.getElementById('mobile-controls');
            if (window.innerWidth <= 768 || 'ontouchstart' in window) {
                mobileControls.style.display = 'block';
                if (!joystickManager) {
                    joystickManager = nipplejs.create({ 
                        zone: document.getElementById('joystick-zone'), 
                        mode: 'static', 
                        position: { left: '50%', top: '50%' }, 
                        color: '#ae1932' 
                    });
                    joystickManager.on('move', (evt, data) => { 
                        const force = Math.min(data.force, 1); 
                        joystickVector.x = Math.cos(data.angle.radian) * force; 
                        joystickVector.y = -Math.sin(data.angle.radian) * force; 
                    });
                    joystickManager.on('end', () => { joystickVector = { x: 0, y: 0 }; });
                }
            } else {
                mobileControls.style.display = 'none';
            }
        }

        initMobileControls();
        window.addEventListener('resize', initMobileControls);

        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); if(gameState === 'PLAYING') shootBall('PLAYER'); });
        document.getElementById('btn-shoot').addEventListener('mousedown', (e) => { e.preventDefault(); if(gameState === 'PLAYING') shootBall('PLAYER'); });

        function startLoading(difficulty) {
            currentDifficulty = difficulty; 
            activeAiConfig = aiStats[difficulty]; 
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('loading-text').classList.remove('hidden');
            gameState = 'LOADING'; setTimeout(startGame, 1000);
        }

        function startGame() {
            document.getElementById('loading-text').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameState = 'PLAYING';

            // 1. 플레이어 로봇 생성 배치
            playerRobot = generateRobotMesh(selectedRobotType);
            playerRobot.position.set(-6, 0, 0);
            scene.add(playerRobot);

            // 2. AI 로봇은 랜덤하게 생성 배치
            const robotOptions = ['TURRET', 'DUMPER', 'CLIMBER'];
            const randomAiType = robotOptions[Math.floor(Math.random() * robotOptions.length)];
            aiRobot = generateRobotMesh(randomAiType);
            aiRobot.position.set(6, 0, 0);
            aiRobot.rotation.y = Math.PI; // AI 로봇은 마주보도록 180도 회전
            scene.add(aiRobot);

            gameInterval = setInterval(() => {
                timeLeft--; document.getElementById('time-display').innerText = timeLeft;
                if(timeLeft <= 10) document.getElementById('time-display').classList.add('timer-danger');
                if (timeLeft <= 0) endGame();
            }, 1000);
            dropBalls(); dropInterval = setInterval(() => { if (totalDroppedCycles < 10) dropBalls(); }, 12000);
        }

        function dropBalls() {
            totalDroppedCycles++;
            for(let i=0; i<10; i++) {
                const ball = new THREE.Mesh(BALL_GEO, GLOBAL_YELLOW_MAT);
                ball.position.set((Math.random() - 0.5) * 10, 6 + Math.random() * 2, (Math.random() - 0.5) * 10); scene.add(ball); fieldBalls.push(ball);
            }
        }

        function shootBall(shooter) {
            let startPos, targetGoalPos, owner, spreadX = 0, spreadZ = 0; 
            if (shooter === 'PLAYER') {
                if (ballCount <= 0) return; ballCount--; updateSlots('player-slots', ballCount); 
                startPos = playerRobot.position; targetGoalPos = new THREE.Vector3(12.5, 3.0, 0); owner = 'PLAYER';
                spreadX = (Math.random() - 0.5) * 0.8; spreadZ = (Math.random() - 0.5) * 0.8;
            } else {
                if (aiBallCount <= 0) return; aiBallCount--; updateSlots('ai-slots', aiBallCount);
                startPos = aiRobot.position; targetGoalPos = new THREE.Vector3(-12.5, 3.0, 0); owner = 'AI';
                spreadX = (Math.random() - 0.5) * activeAiConfig.errorMargin; spreadZ = (Math.random() - 0.5) * activeAiConfig.errorMargin;
            }

            const bullet = new THREE.Mesh(BALL_GEO, GLOBAL_YELLOW_MAT);
            bullet.position.copy(startPos); bullet.position.y = 1.0; scene.add(bullet);
            const distanceX = (targetGoalPos.x + spreadX) - startPos.x; const distanceZ = (targetGoalPos.z + spreadZ) - startPos.z;
            const travelFrames = Math.abs(distanceX) * 3.5; 
            const vx = distanceX / travelFrames; const vz = distanceZ / travelFrames;
            const vy = (targetGoalPos.y - startPos.y) / travelFrames + 0.5 * GRAVITY * travelFrames;
            activeBullets.push({ mesh: bullet, velocity: new THREE.Vector3(vx, vy, vz), targetPos: targetGoalPos, owner: owner });
        }

        // 충돌 물리 연산 구조 상수
        const GOAL_Y_TOP = 2.8;       
        const GOAL_RADIUS = 1.3;     
        const GOAL_CYL_RADIUS = 0.8; 

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            if (gameState === 'PLAYING') {
                const speed = 0.15; let moveX = 0, moveZ = 0;
                if (keys.w) moveZ -= speed; if (keys.s) moveZ += speed;
                if (keys.a) moveX -= speed; if (keys.d) moveX += speed;
                if (joystickVector.x !== 0 || joystickVector.y !== 0) { moveX = joystickVector.x * speed; moveZ = joystickVector.y * speed; }

                if (playerRobot.position.z + moveZ > -6.5 && playerRobot.position.z + moveZ < 6.5) playerRobot.position.z += moveZ;
                if (playerRobot.position.x + moveX > -11.5 && playerRobot.position.x + moveX < 11.5) playerRobot.position.x += moveX;

                if (aiShootCooldown > 0) aiShootCooldown--;

                if (aiBallCount < 7 && fieldBalls.length > 0) {
                    let targetBall = fieldBalls[0]; let minDist = aiRobot.position.distanceTo(targetBall.position);
                    for (let i = 1; i < fieldBalls.length; i++) {
                        let dist = aiRobot.position.distanceTo(fieldBalls[i].position);
                        if (dist < minDist) { minDist = dist; targetBall = fieldBalls[i]; }
                    }
                    const moveDir = new THREE.Vector3().subVectors(targetBall.position, aiRobot.position); moveDir.y = 0; 
                    if (moveDir.length() > 0.1) { moveDir.normalize(); aiRobot.position.addScaledVector(moveDir, activeAiConfig.speed); }
                } else if (aiBallCount > 0 && aiShootCooldown <= 0) { shootBall('AI'); aiShootCooldown = activeAiConfig.shootDelay; }

                for (let i = fieldBalls.length - 1; i >= 0; i--) {
                    const ball = fieldBalls[i]; if (ball.position.y > 0.25) ball.position.y -= 0.1; 
                    // 로봇 중심점 기준 충돌 감지
                    if (playerRobot.position.distanceTo(ball.position) < 1.1 && ballCount < 7) { 
                        scene.remove(ball); fieldBalls.splice(i, 1); ballCount++; updateSlots('player-slots', ballCount); continue;
                    }
                    if (aiRobot.position.distanceTo(ball.position) < 1.1 && aiBallCount < 7) { 
                        scene.remove(ball); fieldBalls.splice(i, 1); aiBallCount++; updateSlots('ai-slots', aiBallCount);
                    }
                }

                // 공 충돌 및 물리 엔진 루프
                for (let i = activeBullets.length - 1; i >= 0; i--) {
                    const bullet = activeBullets[i];
                    const prevY = bullet.mesh.position.y;
                    
                    bullet.mesh.position.add(bullet.velocity); 
                    bullet.velocity.y -= GRAVITY;
                    const currY = bullet.mesh.position.y;

                    const targetGoalX = bullet.targetPos.x;
                    const targetGoalZ = 0; 
                    
                    const dx = bullet.mesh.position.x - targetGoalX;
                    const dz = bullet.mesh.position.z - targetGoalZ;
                    const horizontalDist = Math.sqrt(dx*dx + dz*dz);

                    // [판정 1] 골대 구멍으로 통과 시 득점
                    if (prevY >= GOAL_Y_TOP && currY <= GOAL_Y_TOP) {
                        if (horizontalDist <= GOAL_RADIUS) {
                            if (bullet.owner === 'PLAYER') { 
                                score++; 
                                document.getElementById('score-display').innerText = score; 
                            } else { 
                                aiScore++; 
                                document.getElementById('ai-score-display').innerText = aiScore; 
                            }
                            scene.remove(bullet.mesh); 
                            activeBullets.splice(i, 1);
                            continue;
                        }
                    }

                    // [판정 2] 옆면 바운스
                    if (currY < GOAL_Y_TOP && currY > 0.25) {
                        if (horizontalDist < GOAL_CYL_RADIUS) {
                            const angle = Math.atan2(dz, dx);
                            const normalX = Math.cos(angle);
                            const normalZ = Math.sin(angle);

                            bullet.mesh.position.x = targetGoalX + normalX * GOAL_CYL_RADIUS;
                            bullet.mesh.position.z = targetGoalZ + normalZ * GOAL_CYL_RADIUS;

                            const dotProduct = bullet.velocity.x * normalX + bullet.velocity.z * normalZ;
                            bullet.velocity.x -= 2 * dotProduct * normalX * 0.6;
                            bullet.velocity.z -= 2 * dotProduct * normalZ * 0.6;
                            
                            bullet.velocity.y = Math.abs(bullet.velocity.y) * 0.5; 
                        }
                    }

                    // 외곽 가림막 충돌
                    if (bullet.mesh.position.x > 12.7) { bullet.mesh.position.x = 12.7; bullet.velocity.x *= -0.6; }
                    if (bullet.mesh.position.x < -12.7) { bullet.mesh.position.x = -12.7; bullet.velocity.x *= -0.6; }
                    if (bullet.mesh.position.z > 6.7) { bullet.mesh.position.z = 6.7; bullet.velocity.z *= -0.6; }
                    if (bullet.mesh.position.z < -6.7) { bullet.mesh.position.z = -6.7; bullet.velocity.z *= -0.6; }

                    // 바닥 충돌
                    if (bullet.mesh.position.y <= 0.25) {
                        bullet.mesh.position.y = 0.25;
                        bullet.velocity.y *= -0.5; 
                        bullet.velocity.x *= 0.8;  
                        bullet.velocity.z *= 0.8;

                        if (Math.abs(bullet.velocity.y) < 0.1 && Math.abs(bullet.velocity.x) < 0.05 && Math.abs(bullet.velocity.z) < 0.05) {
                            fieldBalls.push(bullet.mesh);
                            activeBullets.splice(i, 1);
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function endGame() {
            clearInterval(gameInterval); 
            clearInterval(dropInterval); 
            gameState = 'MENU';
            
            const lowestTop10Score = leaderboard.length < 10 ? 0 : leaderboard[leaderboard.length - 1].score;
            
            if (currentDifficulty === 'NORMAL' && score > 0 && (score > lowestTop10Score || leaderboard.length < 10)) {
                setTimeout(() => {
                    let nick = prompt(`[GLOBAL TOP 10 ENTRY - NORMAL MODE]\nSCORE: ${score} PTS\nEnter your Nickname (max 10 chars):`, "Player");
                    if (nick) {
                        nick = nick.substring(0, 10);
                        db.collection("rankings").add({ 
                            name: nick, 
                            score: score, 
                            timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                        })
                        .then(() => { 
                            alert(`SUCCESS!\nFINAL SCORE: YOU ${score} - ${aiScore} AI`); 
                            location.reload(); 
                        })
                        .catch(() => { 
                            alert("Server Error."); 
                            location.reload(); 
                        });
                    } else { 
                        location.reload(); 
                    }
                }, 400);
            } else { 
                let alertMsg = `MATCH OVER!\nFINAL SCORE: YOU ${score} - ${aiScore} AI`;
                if (currentDifficulty !== 'NORMAL') {
                    alertMsg += `\n\n* Leaderboard entry is only available in NORMAL MODE.`;
                }
                alert(alertMsg); 
                location.reload(); 
            }
        }

        gameLoop();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
